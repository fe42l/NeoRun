<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1e40af">
<title>تسجيل الدخول — NeoRun</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="narrow">
  <div class="center" style="margin:12px 0 20px">
    <img src="assets/logo.svg" alt="" width="72" height="72" style="border-radius:20px">
    <h1 class="page-title" style="justify-content:center">مرحباً بك في NeoRun</h1>
    <p class="page-sub">حسابك محفوظ في هذا الجهاز فقط، وبياناتك مشفّرة بكلمة مرورك.</p>
  </div>

  <div class="card">
    <div class="tabs" role="tablist">
      <button type="button" id="tab-login" class="active" role="tab" aria-selected="true">تسجيل الدخول</button>
      <button type="button" id="tab-register" role="tab" aria-selected="false">حساب جديد</button>
    </div>

    <form id="auth-form" novalidate>
      <label for="username">اسم المستخدم</label>
      <input id="username" name="username" autocomplete="username" required>

      <label for="password">كلمة المرور</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required minlength="8">

      <div id="confirm-wrap" class="hidden">
        <label for="password2">تأكيد كلمة المرور</label>
        <input id="password2" type="password" autocomplete="new-password">
      </div>

      <p id="error" class="feedback bad hidden" role="alert"></p>

      <button id="submit" class="btn block" type="submit">
        <i class="fa-solid fa-right-to-bracket"></i> <span id="submit-label">دخول</span>
      </button>
    </form>

    <p class="center muted" style="margin:14px 0 0;font-size:.92rem">
      أو <a href="camera.html">تمرّن كضيف</a> بدون حفظ البيانات.
    </p>
  </div>

  <div class="notice" style="margin-top:16px">
    <i class="fa-solid fa-key"></i>
    <div class="muted" style="font-size:.92rem">
      لا يمكن استعادة كلمة المرور — هي مفتاح تشفير بياناتك، ولا نحتفظ بها في أي مكان.
    </div>
  </div>
</main>

<script src="js/common.js"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  let mode = "login";

  function setMode(m) {
    mode = m;
    $("tab-login").classList.toggle("active", m === "login");
    $("tab-register").classList.toggle("active", m === "register");
    $("tab-login").setAttribute("aria-selected", m === "login");
    $("tab-register").setAttribute("aria-selected", m === "register");
    $("confirm-wrap").classList.toggle("hidden", m === "login");
    $("password").autocomplete = m === "login" ? "current-password" : "new-password";
    $("submit-label").textContent = m === "login" ? "دخول" : "إنشاء الحساب";
    $("error").classList.add("hidden");
  }

  $("tab-login").onclick = () => setMode("login");
  $("tab-register").onclick = () => setMode("register");

  const params = new URLSearchParams(location.search);
  const rawNext = params.get("next") || "index.html";
  const next = /^[a-z]+\.html$/i.test(rawNext) ? rawNext : "index.html";
  if (!NR.store.get("nr_users") || !Object.keys(NR.store.get("nr_users", {})).length) setMode("register");

  if (!NR.cryptoAvailable()) {
    $("error").textContent = "المتصفح لا يدعم التشفير هنا. افتح الموقع عبر https.";
    $("error").classList.remove("hidden");
    $("submit").disabled = true;
  }

  $("auth-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const u = $("username").value;
    const p = $("password").value;
    const err = $("error");
    err.classList.add("hidden");

    if (mode === "register" && p !== $("password2").value) {
      err.textContent = "كلمتا المرور غير متطابقتين";
      err.classList.remove("hidden");
      return;
    }

    $("submit").disabled = true;
    try {
      if (mode === "login") await NR.login(u, p);
      else await NR.register(u, p);
      location.href = mode === "register" && next === "index.html" ? "profile.html" : next;
    } catch (ex) {
      err.textContent = ex.message || "حدث خطأ";
      err.classList.remove("hidden");
      $("submit").disabled = false;
    }
  });
})();
</script>
</body>
</html>

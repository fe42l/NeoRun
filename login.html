<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تسجيل الدخول - SmartFit Guard</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body class="bg-gray-100 flex justify-center items-center h-screen">

<!-- زر العودة -->
<a href="index.html" 
   class="fixed top-4 right-4 bg-gradient-to-r from-blue-700 to-purple-700 text-white px-4 py-2 rounded-full shadow-lg hover:opacity-90 flex items-center gap-2 z-50">
    <i class="fa-solid fa-arrow-right"></i>
    <span>العودة</span>
</a>

<!-- صندوق تسجيل الدخول -->
<div class="bg-white p-8 rounded-2xl shadow-xl w-80 border-t-4 border-purple-600">

    <!-- اللوقو -->
    <img src="assets/logo.png" class="w-24 mx-auto mb-4">

    <h2 class="text-2xl font-bold text-center mb-6 text-purple-700">
        <i class="fa-solid fa-user-lock"></i> تسجيل الدخول
    </h2>

    <input id="username" type="text" placeholder="اسم المستخدم"
           class="w-full p-3 mb-4 border rounded-lg focus:ring-purple-500 focus:border-purple-500">

    <input id="password" type="password" placeholder="كلمة المرور"
           class="w-full p-3 mb-6 border rounded-lg focus:ring-purple-500 focus:border-purple-500">

    <button onclick="login()"
            class="w-full bg-gradient-to-r from-blue-700 to-purple-700 text-white p-3 rounded-lg shadow hover:opacity-90">
        دخول
    </button>

</div>

<script src="app.js"></script>
</body>
</html>

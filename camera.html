<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1e40af">
<title>التمرين — NeoRun</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main>
  <h1 class="page-title"><i class="fa-solid fa-person-running" style="color:var(--brand)"></i> تتبّع التمرين</h1>
  <p class="page-sub">التحليل يتم داخل جهازك — لا يُرفع أي فيديو إلى الإنترنت.</p>

  <div class="camera-layout">
    <div>
      <div class="stage" id="stage">
        <div class="mirror" id="mirror">
          <video id="camera" autoplay playsinline muted></video>
          <canvas id="overlay"></canvas>
        </div>
        <div class="stage-empty" id="stage-empty">
          <div>
            <i class="fa-solid fa-camera"></i>
            <div id="stage-msg">اختر التمرين ثم اضغط «ابدأ»</div>
          </div>
        </div>
        <div class="hud">
          <span class="pill" id="hud-timer">00:00</span>
          <span class="pill hidden" id="hud-rec"><i class="fa-solid fa-circle rec-dot"></i> تسجيل</span>
        </div>
      </div>

      <div class="angles">
        <div><b id="angle-main">—</b><span id="angle-main-label">الزاوية الرئيسية</span></div>
        <div><b id="angle-form">—</b><span id="angle-form-label">زاوية الوضعية</span></div>
      </div>
    </div>

    <aside class="card">
      <label for="exercise">التمرين</label>
      <select id="exercise">
        <option value="squat">سكوات (القرفصاء) — وقوف جانبي</option>
        <option value="pushup">ضغط — وضعية جانبية</option>
        <option value="armraise">رفع الذراعين جانباً — وقوف أمامي</option>
      </select>

      <label for="target">الهدف (عدد التكرارات)</label>
      <input id="target" type="number" inputmode="numeric" min="1" max="500" value="15">

      <label class="check"><input type="checkbox" id="voice" checked> تنبيهات صوتية</label>
      <label class="check"><input type="checkbox" id="record"> سجّل مقطعاً (يُحفظ مشفّراً في جهازك)</label>

      <div class="center" style="margin:18px 0 6px">
        <div class="rep-big" id="reps">0</div>
        <div class="muted" id="reps-sub">تكرار</div>
      </div>
      <div class="progress"><div id="progress"></div></div>

      <div class="feedback" id="feedback" role="status" aria-live="polite" style="margin:14px 0">
        <i class="fa-solid fa-circle-info"></i><span id="feedback-text">جاهز</span>
      </div>

      <div class="btn-row">
        <button class="btn" id="btn-start" style="flex:1"><i class="fa-solid fa-play"></i> ابدأ</button>
        <button class="btn danger hidden" id="btn-stop" style="flex:1"><i class="fa-solid fa-stop"></i> إنهاء</button>
        <button class="btn ghost" id="btn-flip" title="تبديل الكاميرا" aria-label="تبديل الكاميرا"><i class="fa-solid fa-camera-rotate"></i></button>
        <button class="btn ghost" id="btn-reset" title="تصفير العداد" aria-label="تصفير العداد"><i class="fa-solid fa-rotate-left"></i></button>
      </div>

      <p class="muted hidden" id="guest-note" style="font-size:.88rem;margin:12px 0 0">
        <i class="fa-solid fa-circle-info"></i> أنت تتمرن كضيف — <a href="login.html?next=camera.html">سجّل الدخول</a> لحفظ الجلسة والمقاطع.
      </p>
    </aside>
  </div>
</main>

<!-- مكتبات الذكاء الاصطناعي (إصدارات مثبّتة) -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core@4.22.0/dist/tf-core.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter@4.22.0/dist/tf-converter.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl@4.22.0/dist/tf-backend-webgl.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.3/dist/pose-detection.min.js"></script>

<script src="js/common.js"></script>
<script src="js/exercises.js"></script>
<script src="js/camera.js"></script>
</body>
</html>

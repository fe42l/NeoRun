<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>NeoRun</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body class="bg-gray-100">

    <!-- الهيدر مع اللوقو -->
    <header class="bg-gradient-to-r from-blue-800 to-purple-700 text-white p-6 shadow-lg flex items-center gap-4">
        <img src="assets/logo.png" class="w-16 h-16 rounded-full shadow-lg">
        <div>
            <h1 class="text-4xl font-bold">NeoRun</h1>
            <p class="text-lg opacity-90">الحارس الذكي للتدريب الرياضي</p>
        </div>
    </header>

    <!-- القائمة الرئيسية -->
    <div class="grid grid-cols-2 gap-6 p-6">

        <a href="login.html" class="p-6 bg-white rounded-xl shadow hover:shadow-xl text-center border-t-4 border-blue-700">
            <i class="fa-solid fa-user text-4xl text-blue-700 mb-3"></i>
            <h3 class="text-xl font-bold">تسجيل الدخول</h3>
        </a>

        <a href="camera.html" class="p-6 bg-white rounded-xl shadow hover:shadow-xl text-center border-t-4 border-purple-700">
            <i class="fa-solid fa-camera text-4xl text-purple-700 mb-3"></i>
            <h3 class="text-xl font-bold">ابدأ التمرين</h3>
        </a>

        <a href="profile.html" class="p-6 bg-white rounded-xl shadow hover:shadow-xl text-center border-t-4 border-blue-500">
            <i class="fa-solid fa-id-card text-4xl text-blue-500 mb-3"></i>
            <h3 class="text-xl font-bold">المعلومات الشخصية</h3>
        </a>

        <a href="videos.html" class="p-6 bg-white rounded-xl shadow hover:shadow-xl text-center border-t-4 border-purple-500">
            <i class="fa-solid fa-video text-4xl text-purple-500 mb-3"></i>
            <h3 class="text-xl font-bold">المقاطع المسجّلة</h3>
        </a>

        <a href="privacy.html" class="p-6 bg-white rounded-xl shadow hover:shadow-xl text-center col-span-2 border-t-4 border-indigo-600">
            <i class="fa-solid fa-shield-halved text-4xl text-indigo-600 mb-3"></i>
            <h3 class="text-xl font-bold">الخصوصية والأمان</h3>
        </a>

    </div>

</body>
</html>
